name: Build Flet APK (Fixed)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 1. РЕШЕНИЕ ПРОБЛЕМЫ С NODE.JS 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Указываем пути к Android SDK, чтобы Flutter не терялся
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[build]"

      - name: Build APK
        run: flet build apk --yes

      - name: 🔍 Find APK file
        # 2. РЕШЕНИЕ ПРОБЛЕМЫ С НЕВЕРНЫМ ПУТЕМ
        # Эта команда ищет любой .apk файл в папке build и выводит его путь в логи
        id: find_apk
        run: |
          echo "Ищем скомпилированный APK..."
          APK_PATH=$(find build -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "Ошибка: APK файл не найден!"
            exit 1
          fi
          echo "Найден файл: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerApp-Release
          # Используем найденный путь вместо жестко заданного
          path: ${{ steps.find_apk.outputs.apk_path }}
