name: Build Flet APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[build]"

      - name: Build APK
        run: flet build apk --yes

      # ДОБАВЛЕНО: Этот шаг найдет и покажет нам, где именно лежит APK файл
      - name: Debug: Find APK
        run: |
          echo "Ищем APK файлы..."
          find build -name "*.apk"
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerApp-Release
          # ИСПРАВЛЕНО: Используем маску **, чтобы найти APK в любой подпапке
          path: build/**/*.apk 
