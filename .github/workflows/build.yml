name: Build Flet APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[build]"

      - name: Build APK
        run: flet build apk --yes

      - name: Debug: Find APK
        run: |
          echo "Ищем APK файлы в папке build..."
          find build -type f -name "*.apk" || echo "APK не найден"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerApp-Release
          path: "build/**/*.apk"
